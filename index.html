  /* ============================================================
     KULA SOURCE ENGINE v3: TOKEN CONTRACT
     This file is fixed mechanism. Do not edit it per series.
     A skin sets the THIRTEEN identity variables in the block below
     and nothing else is required of it.

     Two accents, split by job:
       --a1  accent one: navigation, progress, emphasis, option letters,
             the primary button, the story date. The "structure" accent.
       --a2  accent two: anything the learner earned. Correct answers,
             the running summary, breakdown bars, key facts, the last
             story line. The "reward" accent.

     the tints, washes and shadows are built from them.
     ============================================================ */

  :root {
    /* ---- THE IDENTITY CONTRACT. A skin overrides these thirteen. ---- */
    --sand:  #F2E9D9;   /* page background */
    --paper: #FBF6EB;   /* cards */
    --cut:   #FFFCF4;   /* insets, sources, carousels */
    --ink:   #1B2A33;   /* body text */
    --clay:  #8C4A2F;   /* stage tags, quiet labels */

    --sans:  system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --mono:  var(--sans);

    /* ---- DERIVED TOKENS. A skin should not need to touch these. ----
       They exist because the engine used to hardcode fourteen literal
       colours, which is what made every glossary definition and every
       source expander invisible in dark mode. Everything below now
       tracks the identity variables above, so a skin that sets --fade
       and --ink correctly gets a readable dark mode for free. ---- */
    --muted:      var(--fade);          /* secondary body text: kt-def, toggle-body, disc-body, cover-line */

    --a2-deep:    #164C3F;              /* --a2 one step darker, button hover */

    --chip-b-bg: rgba(var(--a2-rgb),0.16);  --chip-b-fg: var(--a2);

/* COLD WAR ORIGINS: zone
   Checked against the identity register before designing. Vietnam holds cream
   paper and a serif on soft rounded cards. USA 1920s holds a near-black deco
   ground with tracked-out uppercase. Black Power holds bone with heavy condensed
   uppercase and offset shadows. Black Consciousness holds manila paper with
   typewriter mono on every label. Angola holds cool slate with mono labels and
   hairline squares. Congo holds Ore Seam's warm radial washes. US Civil Rights
   holds Depot: warm grey, asphalt graphite, rose, enamel sign plates.

   The source course had its own identity, near-black violet with a serif display
   face and a mono, framed as signals intelligence. It is dropped: a dark ground
   collides with USA 1920s and mono labels collide with Angola and Frank Talk.

   The metaphor here is the one thing every source in this unit argues about: a
   line drawn across a map. Not the wall, which is only the last chapter, and not
   spy fiction, which is the identity being replaced. So: the diagonal hatch a
   1940s atlas uses to mark an occupied or disputed zone, a border red for
   structure, and a steel blue for anything the learner earned.

   Signature moves, each chosen because nothing else on the register uses it:
     - cards bounded on two sides only, top and left, so they read as territory
       rather than as boxes. Every other identity closes its cards
     - a diagonal hatch ground, where Depot rules horizontally and Angola
       vertically
     - condensed grotesque headings over a book serif body, inverting Depot
     - sources set in a hatched inset, so a source looks like a zone on the map
     - mono appears nowhere */

:root {
  --sand:  #EFEEEA;   /* page: cold paper */
  --paper: #FBFAF7;   /* cards */
  --cut:   #E4E3DD;   /* insets, sources, carousels */
  --ink:   #1B1D1F;
  --clay:  #5A5F63;   /* stage tags, quiet labels */
  /* Muted text: captions, attributions, counters. The previous value measured 3.07
     against the card ground and was the lightest of the four source skins. */
  --fade:  #5E6367;
  /* border red for structure, steel blue for reward */
  --a1: #A32B23;  --a1-rgb: 163,43,35;
  --a2: #2E5F8A;  --a2-rgb: 46,95,138;
  /* The two hover steps are derived, not identity. Left in the engine block
     they kept the engine's bottle green against this skin's steel blue. */
  --ink-deep: #131516;
  --a2-deep:  #214463;
  --sans:  'Archivo Narrow', 'Archivo', 'Inter', system-ui, -apple-system, Arial, sans-serif;
  --serif: 'Source Serif 4', 'Charter', Georgia, serif;
  --mono:  var(--sans);
}

  .btn-begin { font-family: var(--sans); display: inline-flex; align-items: center; gap: 0.8rem; padding: 1.05rem 2.2rem; background: var(--ink); color: var(--on-ink); border: none; cursor: pointer; font-size: 1.12rem; font-weight: 700; }
  .btn-begin:hover { background: var(--ink-deep); }
  /* The arrow takes the button's own text colour. Painted --a1 it disappears on
     any skin that also makes the Begin button --a1 or close to it. */
  .btn-begin .sa { color: currentColor; font-size: 1.3rem; }
  .skip-link { display: block; margin: 1.6rem auto 0; background: transparent; border: none; color: var(--fade); font-family: var(--sans); font-size: 0.84rem; cursor: pointer; text-decoration: underline; }

  /* Story hook */
  .story { padding: 0.6rem 0 0.4rem; min-height: 60vh; display: flex; flex-direction: column; justify-content: center; }
  .story-num { font-family: var(--serif); font-size: clamp(2.6rem,9vw,4rem); font-weight: 800; color: var(--a1); line-height: 1; letter-spacing: -0.02em; }
  .story-unit { font-family: var(--sans); font-size: 0.82rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fade); font-weight: 700; margin-top: 0.5rem; }
  .story-rule { width: 100%; height: 1px; background: var(--hair-strong); margin: 1.4rem 0 1.6rem; }
  .story-line { font-size: 1.24rem; line-height: 1.66; margin-bottom: 1.05rem; opacity: 0; transform: translateY(6px); transition: opacity 0.55s ease, transform 0.55s ease; }
  .story-line.vis { opacity: 1; transform: translateY(0); }
  .story-line.last { color: var(--a2); font-style: italic; font-weight: 600; }

  /* Content cards */
  .card { background: var(--paper); border: 1px solid var(--hair); border-left: 5px solid var(--a1); padding: 1.7rem 1.5rem; margin-bottom: 1.3rem; }
  .stage-tag { font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--clay); font-weight: 700; margin-bottom: 0.9rem; }
  .card h2 { font-family: var(--sans); font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 0.9rem; }
  .card p { font-size: 1.04rem; line-height: 1.74; margin-bottom: 0.9rem; }
  .card p:last-child { margin-bottom: 0; }
  .key { color: var(--a2); font-weight: 700; }        /* one emphasis colour, body face kept */
  .card strong { color: var(--a2); font-weight: 700; }
  .pull { border-left: 4px solid var(--a2); padding: 0.15rem 0 0.15rem 1rem; font-weight: 600; color: var(--ink); margin: 1.15rem 0; font-style: italic; }
  .figure { margin: 1rem 0 0.3rem; }
  .figure img { display: block; height: auto; border: 1px solid var(--hair-strong); margin: 0 auto; }
  .figure.wide img { width: 100%; max-width: 460px; }
  .figure.portrait img { width: 100%; max-width: 320px; }
  .figure figcaption { font-family: var(--serif); font-size: 0.82rem; color: var(--fade); margin-top: 0.5rem; line-height: 1.55; text-align: center; }

  /* Carousel */
  .car-wrap { margin: 0.4rem 0 0; }
  .car-prompt { font-family: var(--sans); font-size: 0.82rem; color: var(--a2); font-weight: 700; margin-bottom: 0.8rem; }
  .car-frame { background: var(--cut); border: 1px solid var(--hair); border-top: 3px solid var(--a1); padding: 1.4rem 1.35rem; min-height: 8.5rem; display: flex; align-items: center; }
  .car-card { font-size: 1.06rem; line-height: 1.7; width: 100%; }
  .car-card .cc-lead { font-family: var(--sans); font-weight: 700; font-size: 0.95rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--clay); display: block; margin-bottom: 0.5rem; }
  .car-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 0.9rem; gap: 1rem; }
  .car-dots { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .car-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hair-strong); }
  .car-dot.read { background: var(--a2); }
  .car-dot.here { outline: 2px solid var(--a1); outline-offset: 2px; }
  .car-count { font-family: var(--sans); font-size: 0.78rem; color: var(--fade); font-weight: 600; }
  .car-btns { display: flex; gap: 0.5rem; }
  .car-btn { font-family: var(--sans); width: 2.4rem; height: 2.4rem; background: var(--paper); border: 1px solid var(--hair-strong); color: var(--ink); font-size: 1.1rem; cursor: pointer; }
  .car-btn:disabled { opacity: 0.32; cursor: not-allowed; }

  /* Stat strip */
  .stat-strip { display: grid; grid-template-columns: repeat(auto-fit,minmax(120px,1fr)); gap: 0.8rem; margin: 0.5rem 0 0.2rem; }
  .stat { background: var(--cut); border: 1px solid var(--hair); border-top: 3px solid var(--a2); padding: 1.1rem 0.7rem; text-align: center; }
  .stat-num { font-family: var(--serif); font-size: 2rem; font-weight: 800; color: var(--a2); line-height: 1; letter-spacing: -0.02em; }
  .stat-label { font-family: var(--sans); font-size: 0.72rem; letter-spacing: 0.06em; color: var(--fade); margin-top: 0.5rem; line-height: 1.4; }

  /* Key terms + memory boxes (collapsed) */
  /* Key terms strip: label + individual expandable chips */
  .kt { margin-top: 1.3rem; }
  .kt-label { font-family: var(--sans); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--a1); padding-top: 0.85rem; border-top: 1px dashed var(--hair-strong); }
  .kt-row { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-top: 0.85rem; }
  .kt-term { border: 1px solid var(--hair-strong); background: transparent; }
  .kt-term summary { font-family: var(--sans); font-size: 0.92rem; font-weight: 600; color: var(--ink); cursor: pointer; list-style: none; padding: 0.55rem 0.85rem; display: inline-flex; align-items: center; gap: 0.5rem; }
  .kt-term summary::-webkit-details-marker { display: none; }
  .kt-term summary::after { content: "+"; color: var(--a1); font-weight: 800; font-size: 1.05rem; }
  .kt-term[open] { display: block; width: 100%; }
  .kt-term[open] summary::after { content: "\2212"; }
  .kt-def { font-size: 0.94rem; line-height: 1.62; color: var(--muted); padding: 0 0.85rem 0.75rem; }

  /* Remember box (collapsed) */
  .remember { margin-top: 0.9rem; border-top: 1px dashed var(--hair-strong); padding-top: 0.7rem; }
  .remember summary { font-family: var(--sans); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; color: var(--a1); cursor: pointer; list-style: none; }
  .remember summary::-webkit-details-marker { display: none; }
  .remember summary::before { content: "+ "; font-weight: 800; }
  .remember[open] summary::before { content: "\2212 "; }
  .remember .disc-body { font-size: 0.96rem; line-height: 1.68; color: var(--muted); margin-top: 0.6rem; background: rgba(var(--a2-rgb),0.06); border-left: 3px solid var(--a2); padding: 0.7rem 0.9rem; }

  /* Sources */
  .source { position: relative; background: var(--cut); border: 1px solid var(--hair); border-top: 3px solid var(--a2); box-shadow: 6px 6px 0 rgba(var(--a2-rgb),0.13); padding: 1.2rem 1.3rem; margin: 1.15rem 0 1.6rem; }
  .source-attr { font-family: var(--sans); font-size: 0.8rem; color: var(--clay); font-weight: 600; margin-bottom: 0.75rem; line-height: 1.5; }

  .toggle-body { display: none; margin-top: 0.7rem; padding-top: 0.7rem; border-top: 1px dashed var(--hair-strong); font-size: 0.94rem; color: var(--muted); line-height: 1.66; }

  /* Questions */
  .q-text { font-size: 1.16rem; line-height: 1.5; font-weight: 600; margin-bottom: 1.2rem; }
  .options { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.2rem; }
  .option { display: flex; align-items: flex-start; gap: 0.85rem; padding: 1rem 1.05rem; background: var(--sand); border: 1px solid var(--hair); cursor: pointer; font-family: var(--serif); text-align: left; font-size: 0.99rem; line-height: 1.55; color: var(--ink); width: 100%; }
  .option:hover:not(:disabled) { background: var(--cut); border-color: var(--a1); }

  .option.correct { background: var(--ok-bg); border-color: var(--a2); border-width: 2px; padding: 0.94rem 0.99rem; }
  .option.wrong { background: var(--no-bg); border-color: var(--clay); border-width: 2px; padding: 0.94rem 0.99rem; }
  /* The dimmed state fell below readable contrast at 360px. One rule per mode,

  .option.dimmed, .option-btn.dimmed { opacity: 0.82; }
  body.dark .option.dimmed, body.dark .option-btn.dimmed { opacity: 0.86; }
  .opt-letter { font-family: var(--serif); font-weight: 800; color: var(--a1); min-width: 1.1rem; }

  .opt-mark { font-weight: 700; font-size: 1.1rem; }
  .explanation { background: var(--cut); border: 1px solid var(--hair); border-left: 5px solid var(--a2); padding: 1.15rem 1.2rem; }

  .expl-text { line-height: 1.7; font-size: 0.96rem; }
  .chip { display: inline-block; font-family: var(--sans); padding: 0.22rem 0.65rem; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .chip-argue { background: var(--chip-a-bg); color: var(--chip-a-fg); }
  .chip-evidence { background: var(--chip-a-bg); color: var(--chip-a-fg); }
  .chip-weigh { background: var(--a2); color: var(--on-a2); }
  .chip-extract { background: var(--chip-a-bg); color: var(--chip-a-fg); }
  .chip-interpret { background: var(--chip-b-bg); color: var(--chip-b-fg); }
  .chip-evaluate { background: var(--a2); color: var(--on-a2); }
  .chip-instinct { background: var(--chip-c-bg); color: var(--clay); }

  /* Reopen the source from inside a question */
  .srcpeek { border: 1px solid var(--clay); background: rgba(var(--a1-rgb),0.07); margin: 0 0 1rem; }
  .srcpeek summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 0.7rem; padding: 0.8rem 0.85rem; color: var(--clay); }
  .srcpeek summary::-webkit-details-marker { display: none; }
  .srcpeek .chev { flex: 0 0 auto; transition: transform 0.18s ease; }
  .srcpeek[open] .chev { transform: rotate(90deg); }
  .srcpeek .peek-cue { font-family: var(--sans); font-size: 0.92rem; font-weight: 700; line-height: 1.25; color: var(--ink); }
  .srcpeek .peek-who { display: block; font-family: var(--sans); font-size: 0.66rem; letter-spacing: 0.09em; text-transform: uppercase; font-weight: 400; color: var(--muted); margin-top: 0.25rem; }
  .srcpeek[open] .peek-cue { color: var(--muted); }
  .srcpeek .peek-body { padding: 0 0.85rem 0.85rem; font-size: 0.94rem; line-height: 1.62; border-top: 1px solid var(--rule); margin: 0 0.85rem; padding-left: 0; padding-right: 0; }
  .srcpeek .peek-body p { margin: 0.7rem 0 0; }

  /* v2.1 multi-source reopen. Tabs plus a swipeable track, so every source in
     the file is reachable from any question. Absent on a single-source lesson,
     which renders exactly as it did before. */
  .srcpeek.multi .peek-body { padding-bottom: 0.5rem; }
  .peek-tabs { display: flex; gap: 0.4rem; overflow-x: auto; padding: 0.7rem 0 0.6rem;
    -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .peek-tabs::-webkit-scrollbar { display: none; }
  .peek-tab { flex: 0 0 auto; min-height: 40px; padding: 0.45rem 0.85rem;
    font-family: var(--sans); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; cursor: pointer;
    background: transparent; color: var(--muted);
    border: 1px solid var(--rule); border-radius: 0; }
  .peek-tab.on { background: var(--a1); color: var(--on-a1); border-color: var(--a1); }
  .peek-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch; scrollbar-width: none; gap: 0; }
  .peek-track::-webkit-scrollbar { display: none; }
  .peek-slide { flex: 0 0 100%; scroll-snap-align: start; padding-right: 0.1rem; }
  .peek-slide .peek-attr { font-family: var(--sans); font-size: 0.66rem; font-weight: 700;
    line-height: 1.45; color: var(--muted); padding-bottom: 0.5rem; margin-bottom: 0.6rem;
    border-bottom: 1px solid var(--rule); }
  .peek-slide p { margin: 0.7rem 0 0; }
  .srcpeek.multi::after { content: "Swipe, or choose a source above."; display: block;
    font-family: var(--sans); font-size: 0.66rem; letter-spacing: 0.06em; color: var(--muted);
    padding: 0.55rem 0 0.2rem; }
  .srcpeek.multi:not([open])::after { display: none; }

  .marks { font-family: var(--mono, var(--sans)); font-size: 0.68rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--a1); font-weight: 700; margin-left: 0.7rem; }
  .q-meta { margin-bottom: 0.9rem; }

  /* order + sort interactions */
  .inter { margin: 0.4rem 0 1rem; }
  .inter-pool { display: flex; flex-direction: column; gap: 0.5rem; }
  .inter-item { font-family: var(--serif); text-align: left; padding: 0.85rem 1rem; background: var(--sand); border: 1px solid var(--hair); cursor: pointer; font-size: 0.97rem; line-height: 1.5; color: var(--ink); display: flex; gap: 0.7rem; align-items: baseline; }
  .inter-item:hover:not(:disabled) { border-color: var(--a1); background: var(--cut); }
  .inter-item .rank { font-family: var(--sans); font-weight: 800; color: var(--a1); min-width: 1.4rem; }
  .inter-placed { background: var(--cut); border-color: var(--a2); }

  .sort-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  .sort-col { background: var(--inset); border: 1px dashed var(--hair-strong); padding: 0.7rem; min-height: 4rem; }
  .sort-col h4 { font-family: var(--sans); font-size: 0.76rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--clay); font-weight: 700; margin-bottom: 0.6rem; text-align: center; }
  .sort-btns { display: flex; gap: 0.4rem; margin-top: 0.5rem; }
  .sort-place { font-family: var(--sans); flex: 1; font-size: 0.78rem; font-weight: 700; padding: 0.4rem; background: var(--paper); border: 1px solid var(--hair-strong); cursor: pointer; color: var(--ink); }

  /* Running summary */

  /* Popup */

  /* Nav */
  .nav { display: flex; justify-content: space-between; gap: 0.8rem; margin-top: 1rem; }
  .btn-secondary { font-family: var(--sans); padding: 0.8rem 1.2rem; background: transparent; border: 1px solid var(--hair-strong); color: var(--ink); font-size: 0.9rem; font-weight: 600; cursor: pointer; }
  .btn-secondary:hover:not(:disabled) { background: var(--paper); }
  .btn-primary { font-family: var(--sans); padding: 0.85rem 1.5rem; background: var(--a2); border: none; color: var(--on-a2); font-size: 0.95rem; cursor: pointer; font-weight: 700; }

  .results-head { text-align: center; margin-bottom: 1.8rem; }

  .results-title { font-family: var(--sans); font-size: clamp(1.9rem,5.5vw,2.7rem); font-weight: 800; letter-spacing: -0.02em; }
  .score-row { display: grid; grid-template-columns: repeat(auto-fit,minmax(130px,1fr)); gap: 0.9rem; margin-bottom: 1.4rem; }
  .score-block { background: var(--paper); border: 1px solid var(--hair); border-top: 4px solid var(--a1); padding: 1.3rem 0.8rem; text-align: center; }
  .score-num { font-family: var(--serif); font-size: 2.6rem; font-weight: 800; color: var(--ink); line-height: 1; letter-spacing: -0.03em; }

/* ============================================================
   LESSON 2 FLAGSHIP LAYER
   Hand patch on the built file. Three jobs:
     1. the floating mode toggle stops covering the Continue
        button and the body text,
     2. attribution stops shouting over the source it credits,
     3. the two sources stop looking like the same object.
   Nothing here touches the step flow, the question mechanics
   or the results breakdowns.
   ============================================================ */

/* ---- 1. TOGGLE CLEARANCE ------------------------------------
   .nav sits in normal flow and .mode-toggle is fixed bottom right,
   so at the foot of a page the toggle sat on top of Continue.
   Reserve the corner, and drop the toggle back at rest so it
   stops obscuring source text mid scroll. ------------------- */
.container { padding-bottom: 4.8rem !important; }
.mode-toggle { opacity: 0.5; transition: opacity 0.18s ease; }
.mode-toggle:hover, .mode-toggle:focus-visible, .mode-toggle:active { opacity: 1; }
@media (hover: none) { .mode-toggle { opacity: 0.62; } }

/* ---- 2. ATTRIBUTION AS A CAPTION, NOT A BANNER --------------
   The provenance line is still complete and still first in the
   DOM for a screen reader. It just stops being the loudest
   thing in the box. ---------------------------------------- */
.source { display: flex !important; flex-direction: column; }
.source .source-body   { order: 1; }
.source .source-attr   { order: 2; }
.source .toggle-btn    { order: 3; }
.source .toggle-body   { order: 4; }
.source-attr {
  background: transparent !important;
  color: var(--fade) !important;
  font-size: 0.72rem !important;
  font-weight: 600 !important;
  line-height: 1.55 !important;
  padding: 0.7rem 0 0 !important;
  margin: 0.9rem 0 0 !important;
  border-top: 1px solid var(--hair-strong) !important;
}
body.dark .source-attr {
  background: transparent !important;
  color: var(--fade) !important;
  border-top-color: var(--hair-strong) !important;
}

/* ---- 3. TWO SOURCES, TWO OBJECTS ----------------------------
   The lesson asks the learner to hold a speech against a cable.
   Until now both arrived in the same red hatched box, so the
   only difference on the screen was the words. Source A keeps
   the red of the eastern bloc on this unit's map. Source B
   takes the steel blue the same map gives Berlin and the West.
   ---------------------------------------------------------- */

/* Source A: a printed speech, set as a page from the Moscow edition. */
.source.src-speech { border-color: var(--a1) !important; }
.source.src-speech .source-body > p:first-of-type::first-letter {
  font-family: var(--serif); font-size: 3.05rem; line-height: 0.82;
  float: left; padding: 0.28rem 0.5rem 0 0; color: var(--a1); font-weight: 600;
}
.src-imprint {
  font-family: var(--sans); font-size: 0.6rem; font-weight: 700;
  letter-spacing: 0.2em; text-transform: uppercase; text-align: center;
  color: var(--a1); padding-bottom: 0.85rem; margin-bottom: 1rem;
  border-bottom: 1px solid rgba(var(--a1-rgb),0.32);
}

/* Source B: an incoming cable. Cold ground, no hatch, machine type. */
.source.src-cable {
  padding: 1rem 0.85rem !important;
  border-color: var(--a2) !important;
  background: #E6EAEE !important;
  background-image: none !important;
  box-shadow: 5px 5px 0 rgba(var(--a2-rgb),0.16) !important;
}
body.dark .source.src-cable { background: rgba(46,95,138,0.16) !important; }
.source.src-cable .source-body,
.source.src-cable .source-body p {
  font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace !important;
  font-size: 1rem !important;
  line-height: 1.7 !important;
  letter-spacing: -0.022em;
}
.source.src-cable .source-attr { border-top-color: rgba(var(--a2-rgb),0.4) !important; }
.source.src-cable .toggle-btn { color: var(--a2) !important; }
.cable-head {
  font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
  font-size: 0.74rem; line-height: 1.8; letter-spacing: 0.01em;
  text-transform: uppercase; color: var(--a2);
  border-top: 3px double var(--a2); border-bottom: 3px double var(--a2);
  padding: 0.6rem 0; margin: 0 0 1.05rem;
}
.cable-head b { font-weight: 700; }
.cable-head .cab-secret {
  float: right; border: 1.5px solid var(--a2); padding: 0 0.34rem;
  letter-spacing: 0.18em; font-weight: 700;
}
body.dark .cable-head, body.dark .source.src-cable .toggle-btn { color: #96C0E6; }
body.dark .cable-head { border-color: #96C0E6; }
body.dark .cable-head .cab-secret { border-color: #96C0E6; }

/* ---- 4. THE FACE OFF ----------------------------------------
   The comparison question used to be the first moment the two
   documents met. Now they meet on a screen of their own, with
   no editorial line telling the learner what each one blames.
   ---------------------------------------------------------- */
.faceoff { margin: 1.25rem 0 0.4rem; }
.fo-panel { border: 2px solid var(--a1); background: var(--cut); padding: 0.95rem 1rem 1rem; }
.fo-panel + .fo-panel { margin-top: 0; border-top: 0; }
.fo-a { border-color: var(--a1); background-image:
  repeating-linear-gradient(45deg, transparent 0 7px, rgba(163,43,35,0.055) 7px 8px); }
.fo-b { border-color: var(--a2); background: #E6EAEE; background-image: none; }
body.dark .fo-b { background: rgba(46,95,138,0.16); }
.fo-head {
  font-family: var(--sans); font-size: 0.63rem; font-weight: 700;
  letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 0.6rem;
}
.fo-a .fo-head { color: var(--a1); }
.fo-b .fo-head { color: var(--a2); }
body.dark .fo-b .fo-head { color: #96C0E6; }
.fo-panel p { font-size: 0.95rem; line-height: 1.66; margin: 0 0 0.6rem; }
.fo-panel p:last-child { margin-bottom: 0; }
.fo-b p { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
  font-size: 0.82rem; line-height: 1.72; }
.fo-seam {
  font-family: var(--sans); font-size: 0.6rem; font-weight: 700;
  letter-spacing: 0.22em; text-transform: uppercase; color: var(--fade);
  text-align: center; padding: 0.5rem 0; border-left: 2px solid var(--hair-strong);
  border-right: 2px solid var(--hair-strong);
}
@media (min-width: 700px) {
  .faceoff { display: grid; grid-template-columns: 1fr 1fr; }
  .fo-panel + .fo-panel { border-top: 2px solid var(--a2); }
  .fo-seam { display: none; }
}

/* ---- 5. RESULTS: THE BAND CARD STOPS ORPHANING --------------
   At 390px the auto fit grid gives two columns, so the third
   card sat half width against dead space. ------------------- */
@media (max-width: 619px) {
  .score-row .score-block:nth-child(3) { grid-column: 1 / -1; }
}

/* ---- 6. THE REOPEN STRIP ------------------------------------
   Two sources means two tabs, so give the tabs room to read as
   controls rather than as part of the cue line. ------------- */
.peek-tab { font-family: var(--sans) !important; letter-spacing: 0.08em; }


/* ---- 7. THE HOOK AS A CLOCKED SCENE -------------------------
   The marker becomes a stamped time rather than a headline, in
   the same machine face the cable carries later in the lesson.
   The narration sits back and the line the learner has to hold
   sits forward, so the ladder reads as arriving rather than as
   a paragraph broken up. ------------------------------------ */
.story-num {
  font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace !important;
  font-size: clamp(3.4rem, 14vw, 5.2rem) !important;
  font-weight: 400 !important;
  color: var(--a1) !important;
  letter-spacing: -0.03em !important;
  font-variant-numeric: tabular-nums;
}
.story-unit {
  font-size: 0.66rem !important;
  letter-spacing: 0.26em !important;
  color: var(--fade) !important;
  margin-top: 0.35rem !important;
}
.story-rule { margin: 1.15rem 0 1.5rem !important; }
.story-line { color: var(--clay); }
.story-line strong { color: var(--ink); font-weight: 700; }
.story-line.last { color: var(--a2) !important; font-style: normal !important; font-weight: 600 !important; }
.story-line.last::before {
  content: ""; display: block; width: 46px; height: 2px;
  background: var(--a2); margin: 1.4rem 0 1.1rem;
}
body.dark .story-line strong { color: var(--white, #E7EBEE); }


/* The reopen cue previews the source's own words now, so it reads as prose. */
.peek-who { text-transform: none !important; letter-spacing: 0 !important; }

/* ---- 7. THE TIME RAIL ---------------------------------------
   A hook line can now carry a marker, so a run of years reads as
   a run of years rather than as a paragraph broken up. Side one
   takes the red this unit gives the east on its map; side two
   takes the steel blue it gives the west. The same two colours
   then carry Source A, Source B and the face off panels, so the
   learner meets one visual argument four times in the lesson.
   ---------------------------------------------------------- */
.story-line.marked {
  display: grid; grid-template-columns: 4.6rem 1fr; gap: 0.85rem;
  align-items: baseline; margin-bottom: 1.15rem;
}
.tl-mark {
  font-family: var(--sans); font-size: 0.62rem; font-weight: 700;
  letter-spacing: 0.13em; text-transform: uppercase; color: var(--a1);
  border-left: 2px solid var(--a1); padding-left: 0.5rem; line-height: 1.5;
}
.tl-text { display: block; }
.story-b .tl-mark { color: var(--a2); border-left-color: var(--a2); }
.story-b .story-num { color: var(--a2) !important; }
.story-b .story-rule {
  background-image:
    linear-gradient(90deg, var(--a2) 0 84px, transparent 84px 100%),
    repeating-linear-gradient(90deg, var(--a2) 84px 96px, transparent 96px 106px) !important;
}
body.dark .story-b .tl-mark { color: #96C0E6; border-left-color: #96C0E6; }
body.dark .story-b .story-num { color: #96C0E6 !important; }
.story-line.marked + .story-line:not(.marked) { margin-top: 1.8rem; }
/* The engine draws a short rule before the closing line with a ::before.
   Inside a grid that pseudo element claims a cell and shoves the marker
   and the text out of their columns, so a marked closing line collapsed
   to one word per row. Take the rule off the grid and hang it above. */
.story-line.marked.last {
  color: var(--clay) !important; font-weight: 400 !important; font-style: normal !important;
}
.story-line.marked.last::before { display: none !important; }
@media (max-width: 400px) {
  .story-line.marked { grid-template-columns: 4rem 1fr; gap: 0.7rem; }
}


/* ---- 8. CORRECT READS GREEN ---------------------------------
   The reward accent in this skin is the steel blue the map gives
   the west, and that blue is now doing a second job: Source B,
   side two of the hook, and the right hand face off panel. A
   correct answer wearing the same blue read as "this is Kennan"
   rather than "you got it". So the earned states take a green of
   their own and the identity keeps its two colours.

   Green is added here, not by repointing --a2, because --a2 also
   paints the primary button, the marks, the story rule and the
   breakdown label. Changing the token would turn the whole unit
   green and lose the argument the red and blue are making.

   Measured on the skin's own grounds:
     light  #2A6349 letter and border on the tint   4.68 : 1
            ink body text on the tint              11.0  : 1
     dark   #8BD1A4 letter and border on the tint   5.11 : 1
   Colour is never the only signal: the tick and the cross glyphs
   carry the state as well, which matters for the commonest form
   of colour blindness, where red against green is the hard pair.
   ---------------------------------------------------------- */
:root { --ok: #2A6349; --ok-rgb: 42,99,73; }
body.dark { --ok: #8BD1A4; --ok-rgb: 139,209,164; }

.option.correct, .option-btn.correct {
  background: rgba(var(--ok-rgb),0.13) !important;
  border-color: var(--ok) !important;
}
.option.correct .opt-letter, .option-btn.correct .opt-letter { color: var(--ok) !important; }
.option.correct .opt-mark,   .option-btn.correct .opt-mark   { color: var(--ok) !important; }

body.dark .option.correct, body.dark .option-btn.correct {
  background: rgba(var(--ok-rgb),0.20) !important;
  border-color: var(--ok) !important;
  color: var(--ink) !important;
}
body.dark .option.correct .opt-letter, body.dark .option-btn.correct .opt-letter { color: var(--ok) !important; }
body.dark .option.correct .opt-mark,   body.dark .option-btn.correct .opt-mark   { color: var(--ok) !important; }

/* A correctly placed item in the sort and order questions is the
   same signal, so it takes the same green. */
.inter-item.ok {
  background: rgba(var(--ok-rgb),0.13) !important;
  border-color: var(--ok) !important;
}
.inter-item.ok .rank { color: var(--ok) !important; }
body.dark .inter-item.ok { background: rgba(var(--ok-rgb),0.20) !important; border-color: var(--ok) !important; }

/* The results bars measure what the learner earned, so they match. */
.bd-fill { background: var(--ok) !important; }


/* ---- 9. THE CABLE HOLDS ITS COLOUR IN DARK MODE -------------
   The skin repaints every .source with the red accent and the
   red hatch when the ground inverts, which put Source B back in
   Moscow's colour at night. Restated after it, so the speech and
   the cable stay two different objects in both modes.
   ---------------------------------------------------------- */
body.dark .source.src-cable {
  border-color: #6BA3D6 !important;
  background: rgba(107,163,214,0.14) !important;
  background-image: none !important;
  box-shadow: 5px 5px 0 rgba(107,163,214,0.16) !important;
}
body.dark .source.src-cable .source-attr { border-top-color: rgba(107,163,214,0.4) !important; }
body.dark .cable-head { color: #96C0E6 !important; border-color: #96C0E6 !important; }
body.dark .cable-head .cab-secret { border-color: #96C0E6 !important; }
body.dark .source.src-cable .toggle-btn { color: #96C0E6 !important; }
body.dark .fo-b { background: rgba(107,163,214,0.14) !important; border-color: #6BA3D6 !important; }
body.dark .fo-b .fo-head { color: #96C0E6 !important; }


/* ---- 10. THE CORRECT OPTION FILLS -----------------------------
   A 13 per cent tint was too quiet: on a bright phone screen the
   right answer and the untouched options were nearly the same
   card. The correct option now takes a solid green ground with
   the skin's hard offset shadow, so it reads as the answer from
   across the room and not on inspection.

   The asymmetry is deliberate. The option you got right is loud.
   The one you picked and got wrong stays a quiet clay tint with
   a firm border, because a learner who is already wrong does not
   need it shouted at them.

   Measured: light  paper text on #215239        8.63 : 1
                    the fill against the page    7.76 : 1
             dark   ink text on #8BD1A4          9.99 : 1
   ------------------------------------------------------------ */
:root { --ok: #215239; --ok-rgb: 33,82,57; --on-ok: #FBFAF7; }
body.dark { --ok: #8BD1A4; --ok-rgb: 139,209,164; --on-ok: #14181C; }

.option.correct, .option-btn.correct,
body.dark .option.correct, body.dark .option-btn.correct {
  background: var(--ok) !important;
  border: 2px solid var(--ok) !important;
  box-shadow: 5px 5px 0 rgba(var(--ok-rgb),0.30) !important;
  color: var(--on-ok) !important;
}
.option.correct .opt-text, .option-btn.correct .opt-text,
.option.correct .opt-letter, .option-btn.correct .opt-letter,
.option.correct .opt-mark, .option-btn.correct .opt-mark,
body.dark .option.correct .opt-text, body.dark .option-btn.correct .opt-text,
body.dark .option.correct .opt-letter, body.dark .option-btn.correct .opt-letter,
body.dark .option.correct .opt-mark, body.dark .option-btn.correct .opt-mark {
  color: var(--on-ok) !important;
}
.option.correct .opt-letter, .option-btn.correct .opt-letter { opacity: 0.85; }

/* The wrong pick keeps its warm tint and gains a firm edge, so the
   pair reads at a glance without the wrong one competing. */
.option.wrong, .option-btn.wrong {
  background: var(--no-bg) !important;
  border: 2px solid var(--a1) !important;
  box-shadow: none !important;
}
.option.wrong .opt-letter, .option.wrong .opt-mark,
.option-btn.wrong .opt-letter, .option-btn.wrong .opt-mark { color: var(--a1) !important; }

/* A correctly placed item in the sort and order questions is the
   same signal, so it fills the same way. */
.inter-item.ok, body.dark .inter-item.ok {
  background: var(--ok) !important;
  border: 2px solid var(--ok) !important;
  color: var(--on-ok) !important;
}
.inter-item.ok span, .inter-item.ok .rank,
body.dark .inter-item.ok span, body.dark .inter-item.ok .rank { color: var(--on-ok) !important; }
.inter-item.ok .rank { opacity: 0.85; }


/* ============================================================
   REVIEW FIXES
   ============================================================ */

/* ---- Correctness now reads on the sort and the order ---------
   These two screens used to look the same after Check as before
   it, because the only change was a pale tint. A tick or a cross
   now sits on every placed item, and a wrong item in an order
   question is told where it belonged.
   ------------------------------------------------------------ */
.inter-item { justify-content: flex-start; }
.inter-body { flex: 1 1 auto; }
.inter-mark { font-weight: 700; font-size: 1.1rem; margin-left: 0.6rem; flex: 0 0 auto; }
.inter-item.ok .inter-mark { color: var(--on-ok) !important; }
.inter-item.no {
  background: var(--no-bg) !important;
  border: 2px solid var(--a1) !important;
}
.inter-item.no .inter-mark, .inter-item.no .rank { color: var(--a1) !important; }
.inter-should {
  display: block; margin-top: 0.3rem;
  font-family: var(--sans); font-size: 0.72rem; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase; color: var(--a1);
}

/* ---- The sort bins stop looking like drag targets -------------
   A dashed border is the web's convention for drop me here, and
   there is no drag and drop anywhere in the page. Solid hairline,
   so the bins read as the containers they are.
   ------------------------------------------------------------ */
.sort-col { border-style: solid !important; }

/* ---- Blue stops meaning five different things ----------------
   The reward accent was carrying: the correct answer, a key term
   you can open, the First pass label you cannot, the Continue
   button, and the map annotations. The correct answer has already
   moved to green. This separates the remaining two that matter:
   a key term you can open keeps the accent and gains a dotted
   underline, and an inline label that does nothing loses the
   accent entirely and becomes ink.
   ------------------------------------------------------------ */
.card p > strong:first-child, .source p > strong:first-child { color: var(--ink) !important; }
.kt-term > summary {
  color: var(--a2);
  text-decoration: underline;
  text-decoration-style: dotted;
  text-underline-offset: 3px;
}

/* ---- What a mark allocation means ----------------------------
   (2 x 2) is exam notation and it is never explained anywhere in
   the file. It is glossed once, on the first assessed question.
   ------------------------------------------------------------ */
.marks-gloss {
  font-family: var(--sans); font-size: 0.74rem; line-height: 1.5;
  color: var(--fade); margin: -0.3rem 0 0.9rem;
  border-left: 2px solid var(--hair-strong); padding-left: 0.6rem;
}


/* ---- The map key and the Germany inset leave the SVG ----------
   Both were authored inside a 620 unit viewBox that renders at
   about 308px on a phone. At that half scale the key type landed
   near 5.7px and the inset labels near 4.7px, which is not
   readable at any age. Neither is a drawing, so both come out of
   the SVG and become real text that scales with the page. The
   inset keeps a small diagram on its own viewBox, which renders
   close to one to one.
   ------------------------------------------------------------ */
.map-key { list-style: none; margin: 0.9rem 0 0; padding: 0; }
.map-key li {
  display: flex; align-items: flex-start; gap: 0.6rem;
  font-family: var(--sans); font-size: 0.86rem; line-height: 1.5;
  color: var(--ink); margin-bottom: 0.5rem;
}
.mk { flex: 0 0 auto; width: 20px; height: 14px; margin-top: 0.18rem; border: 1px solid #8B8F93; }
.mk-east { border-color: #A32B23; background-image:
  repeating-linear-gradient(45deg, transparent 0 5px, rgba(163,43,35,0.42) 5px 6px); }
.mk-west { background: #DCDBD4; }
.mk-neutral { background: #EDECE6; }
.mk-outside { border-color: #A32B23; border-style: dashed; background: #E7E2E0; }
body.dark .map-key li { color: var(--ink); }

.inset-block { margin-top: 1.1rem; border-top: 1px solid var(--hair-strong); padding-top: 0.9rem; }
.inset-head {
  font-family: var(--sans); font-size: 0.7rem; font-weight: 700;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--fade);
  margin-bottom: 0.6rem;
}
.inset-block svg { width: 100%; height: auto; max-width: 330px; font-family: var(--sans); }
.inset-note {
  font-family: var(--sans); font-size: 0.86rem; line-height: 1.55;
  color: var(--ink); margin: 0.6rem 0 0;
}


/* ---- Sort columns stack on a phone ---------------------------
   .sort-cols is a hard two column grid, so at 390px each column
   is about 110px and a ten word claim wraps to one word a line.
   Below 560px they stack full width and keep their headings, so
   the sorting is still visible and the text is still text.
   ------------------------------------------------------------ */
@media (max-width: 560px) {
  .sort-cols { grid-template-columns: 1fr; gap: 0.7rem; }
  .sort-col { min-height: 3rem; }
}


.score-note {
  font-family: var(--sans); font-size: 0.8rem; line-height: 1.55;
  color: var(--fade); text-align: center; margin: -0.4rem 0 1.3rem;
}


/* ---- The reopen preview is prose, not a label ------------------
   .peek-who was uppercased, which was fine when it showed a
   bibliography line and wrong now that it shows a sentence of the
   source. A full sentence in capitals is slower to read and it was
   also what made the old truncation look like shouting.
   -------------------------------------------------------------- */
.peek-who { text-transform: none !important; letter-spacing: 0 !important; }


/* ============================================================
   THE MODE TOGGLE LEAVES THE READING COLUMN
   It was fixed to the bottom right of the viewport, over a single
   column layout, so on a phone it sat on top of whatever was
   there: source text, an explanation, the Continue button. No
   corner solves that, because at 390px the column is the whole
   screen. The only real fix is to take it out of the content area
   entirely, so it moves up into the header band.

   The button stays a body child rather than moving into #top-bar,
   because the top bar is hidden on the cover and a child of a
   hidden parent would go with it. Instead the header row reserves
   the space and the toggle is pinned into it.

   Below 520px it is icon only at the full 44px tap target, with
   the words kept for screen readers and as a tooltip. Above that
   the label is shown, so the corpus standard of an icon plus
   "Light mode" or "Dark mode" holds wherever there is room.
   ============================================================ */
.mode-toggle {
  position: fixed !important;
  top: 0.4rem !important; right: 0.55rem !important;
  bottom: auto !important; left: auto !important;
  opacity: 1 !important;
  min-height: 44px; min-width: 44px;
  justify-content: center;
  box-shadow: none !important;
}
.top-meta { padding-right: 3.4rem; }
.container { padding-bottom: 1.4rem !important; }

@media (max-width: 520px) {
  .mode-toggle { padding: 0 !important; gap: 0 !important; }
  .mode-toggle #mode-label {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .mode-toggle svg { width: 1.15rem; height: 1.15rem; }
}
@media (min-width: 521px) {
  .top-meta { padding-right: 9.5rem; }
}


/* ---- The wrong-answer glyph clears 4.5 on the dark ground -----
   --a1 measured 3.76 against the wrong-option tint once the rgba
   is composited. The tick and the cross are what carry the state
   for a learner who cannot separate the two hues, so the glyph
   has to be legible on its own. 5.57 after this.
   -------------------------------------------------------------- */
body.dark .option.wrong .opt-letter, body.dark .option.wrong .opt-mark,
body.dark .option-btn.wrong .opt-letter, body.dark .option-btn.wrong .opt-mark,
body.dark .inter-item.no .inter-mark, body.dark .inter-item.no .rank {
  color: #EFA79E !important;
}

</style>

    <div class="track"><div class="fill" id="fill"></div></div>

    <button class="btn-primary" id="next-btn">Continue &rarr;</button>
  </div>
</div>

<script>
/* ---- LMS EMBED EVENTS ----------------------------------------------------
   Two moments, deliberately separate. Reaching the closing screen marks the
   activity done for progress tracking. Choosing to leave it advances. Firing
   advance on arrival would pull the learner off their own results screen
   before they had read it. ------------------------------------------------ */
var KulaLMS = (function(){
  var done = false;
  function send(ev){
    try{
      window.parent.postMessage({ type: 'lms-embed-event', version: '1.0',
        payload: { event: ev } }, '*');
    }catch(e){}
  }
  return {
    completed: function(){ if(done) return; done = true; send('completed'); },
    advance:   function(){ send('advance'); }
  };
})();
/* kula: re-entry guard. Every declaration below is function scoped, so a
   viewer that re-runs this script re-initialises instead of throwing a
   redeclaration SyntaxError and leaving FLOW undefined. */
(function(){
const COVER = {
  "eyebrow": "Kula Revise &middot; Grade 12 History &middot; Cold War",
  "title": "The Iron Curtain",
  "lines": [
    "Roosevelt is dead. Truman has the bomb.",
    "Stalin is breaking his promises.",
    "And Churchill is about to give the most famous speech of the Cold War."
  ],
  "begin": "Begin Lesson 2",
  "time": "About 30 minutes. Lesson 2 of 5.",
  "skip": true
};

const RESULTS = {
  "eyebrow": "Lesson 2 report",
  "title": "Where you stand",
  "next": "Continue to Lesson 3",
  "footer": "Next: Lesson 3, what Washington decided to do about it.",
  "bands": {
    "excellent": "You can hold two sources apart and say what each one is afraid of. Go on to Lesson 3.",
    "strong": "Solid. Run the recap cards once more, then go on to Lesson 3.",
    "solid": "The shape is there. Reread both sources and the comparison question, then go on.",
    "patchy": "Worth another run. The comparison move here comes back in Lesson 4.",
    "start": "Take it again from the top. Read the two sources side by side before you answer anything."
  }
};

const FLOW = [
  {
    "type": "story",
    "marker": "The same soldiers, twice",
    "markerLabel": "Archangel and Vladivostok &middot; 1918",
    "lines": [
      {
        "text": "Russia leaves the war against Germany. Within months British, French, American and Japanese troops land on Russian soil."
      },
      {
        "text": "London says the troops are there to guard war supplies and to hold an eastern front against Germany."
      },
      {
        "text": "Moscow says fourteen states have invaded to put down a revolution."
      },
      {
        "text": "**Both describe the same landings.**"
      },
      {
        "text": "Twenty-seven years later those governments are allies. Each of them still remembers what the other did in 1918."
      }
    ]
  },
  {
    "type": "question",
    "kind": "instinct",
    "q": "Which account of the landings would a historian trust?",
    "options": [
      "London's, because a government knows its own reason for sending troops",
      "Moscow's, because the troops landed on Russian soil and not on British",
      "Both, because each side describes a part of what those troops did",
      "Neither, because a government explaining its own army always misleads"
    ],
    "correct": 2,
    "explanation": "There is no score on this one. The war supplies were real, and so was the fighting against the new government. Each side is telling you the part it could see and the part it needed. You are about to watch two governments do this to each other, thirteen days apart. In the exam an answer that picks a winner between two sources like these earns nothing, because the question is asking what each source is for.",

  {
    "type": "content",
    "tag": "The turn",
    "html": "<h2>The word for what you just did</h2><p>You did not settle which account of the landings was right. You worked out that each was built out of where the teller was standing.</p><p>That is <strong>perspective</strong>: what a source argues for depends on what it is afraid of.</p><p>Paper 1 asks this directly. <em>How does Source A differ from Source B?</em> The command word wants both positions named and set against each other. Give only one side and you have written half an answer.</p>",
    "remember": "A comparison answer carries both sources. One side on its own is not a comparison, no matter how well you argue it.",
    "terms": [
      {
        "term": "Perspective",
        "def": "Where a source stands on an issue, and how that position shapes what it says."
      },
      {
        "term": "Compare and contrast",
        "def": "The hardest of the three source skills. Set two sources against each other and say how they differ or how they agree."
      }
    ]
  },
  {
    "type": "content",
    "tag": "The evidence",
    "html": "<h2>Who was actually standing where</h2><p>The Red Army had not gone home. It had driven the Germans back across Poland, Romania, Bulgaria, Hungary and into eastern Germany, and it stayed.</p><p>Whoever holds the ground decides who runs the country. Communist ministers took the key posts, opposition parties were merged or banned, and elections either did not happen or produced one answer.</p><p>By 1948 eight states in Eastern Europe had governments loyal to Moscow. They are called <strong>satellite states</strong>: formally independent, actually steered from outside.</p>",
    "remember": "The promise at Yalta was free elections. What decided the outcome was which army was standing in the country.",
    "terms": [
      {
        "term": "Sphere of influence",
        "def": "An area a great power controls or steers without formally ruling it."
      },
      {
        "term": "Satellite state",
        "def": "A country that is called independent but whose government follows another power's instructions."
      },
      {
        "term": "Red Army",
        "def": "The Soviet army. Its position in Eastern Europe in 1945 is the single biggest fact of this lesson."
      }
    ]
  },
  {
    "type": "content",
    "tag": "The evidence",
    "html": "<h2>Czechoslovakia, February 1948</h2><p>Czechoslovakia was the one that mattered most to Western opinion. It was the only Eastern European country with a real democratic tradition, and parties had really competed in its 1946 election.</p><p>In February 1948 the communist members of the coalition government took control of the police, forced the non-communist ministers out and took power outright. The foreign minister, Jan Masaryk, was found dead below a window two weeks later.</p><p>For anyone in the West still arguing that Soviet policy was defensive, February 1948 ended the argument. It is also why the Marshall Plan passed Congress the following month, which is Lesson 3.</p><figure class=\"figure wide\"><svg viewBox=\"0 0 620 470\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Map of Europe divided by the iron curtain in 1949, with an inset showing Germany and Berlin\"> <defs> <pattern id=\"hatch\" width=\"7\" height=\"7\" patternTransform=\"rotate(45)\" patternUnits=\"userSpaceOnUse\"> <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"7\" stroke=\"#A32B23\" stroke-width=\"1.7\" opacity=\"0.34\"/> </pattern> <clipPath id=\"frame\"><rect x=\"0\" y=\"0\" width=\"620\" height=\"470\"/></clipPath> </defs> <rect width=\"620\" height=\"700\" fill=\"#EFEEEA\"/> <g clip-path=\"url(#frame)\"> <path d=\"M37.4 434.9 L36.3 429.6 L31.1 428.7 L28.4 425.4 L29.3 419.6 L33.9 416.4 L34.7 412.8 L37.1 407.3 L36.8 403.5 L34.6 400.2 L34.0 397.1 L34.6 390.5 L29.9 386.4 L46.2 379.6 L60.2 381.3 L75.6 381.2 L87.9 382.9 L97.4 382.4 L115.9 382.7 L121.9 377.0 L124.1 357.6 L112.2 347.1 L103.8 342.0 L86.2 338.0 L85.1 330.5 L99.9 328.2 L119.2 330.9 L115.6 319.0 L126.4 323.6 L153.1 315.3 L156.6 306.4 L166.6 304.2 L175.8 302.0 L175.8 302.0 L181.8 299.0 L191.8 282.5 L207.5 277.6 L217.1 278.0 L219.2 281.9 L216.3 292.2 L213.4 296.4 L206.5 296.4 L208.5 308.0 L207.2 315.3 L209.5 317.7 L208.8 322.3 L214.2 325.1 L230.8 327.0 L225.0 334.2 L223.5 341.5 L220.4 343.2 L215.1 342.3 L215.5 34     "html": "<h2>Stalin, 9 February 1946</h2><p>An election speech at the Bolshoi Theatre in Moscow, his first major speech since the war ended.</p><p><strong>First pass:</strong> what does he say caused the Second World War?</p><p><strong>Second pass:</strong> if that is the cause, what follows about the future?</p>",
    "source": {
      "attr": "Source A: from the speech delivered by J V Stalin at a meeting of voters of the Stalin electoral district, Moscow, 9 February 1946. From the English edition published by the Foreign Languages Publishing House, Moscow, 1946. Out of copyright.",
      "body": "<div class=\"src-imprint\">Speech to the voters &middot; Bolshoi Theatre, Moscow</div><p>It would be wrong to think that the Second World War broke out accidentally, or as a result of blunders [mistakes] committed by certain statesmen, although blunders were certainly committed. As a matter of fact, the war broke out as the inevitable [unavoidable] result of the development of world economic and political forces on the basis of present-day monopolistic capitalism.</p><p>Marxists have more than once stated that the capitalist system of world economy contains the elements of a general crisis and military conflicts, that, in view of that, the development of world capitalism in our times does not proceed smoothly and evenly, but through crises and catastrophic wars.</p><p>The point is that the uneven development of capitalist countries usually leads, in the course of time, to a sharp disturbance of the equilibrium [balance] within the world system of capitalism, and that group of capitalist countries [which] regards itself as being less securely provided with raw materials and markets usually attempts to change the situation and to redistribute spheres of influence in its own favour, by employing armed force.</p>",
      "toggle": "Two things need naming. Monopolistic capitalism is the Marxist term for capitalism at the stage where a few huge firms dominate, and Stalin is arguing that this stage of capitalism produces wars by itself, without anyone choosing one. Inevitable is the word doing the most work: if wars come from how capitalism is built, then no treaty and no goodwill can prevent the next one. Notice also what he does not say. He never names the United States or Britain, and he does not have to. The audience knew which countries were capitalist, and so did every diplomat who read the transcript.",
      "toggleLabel": "What does this actually mean?"
    },
    "terms": [

        "term": "Monopolistic capitalism",

        "def": "Bound to happen, and impossible to prevent. The most important word in this source."
      }

    "html": "<h2>Kennan, 22 February 1946</h2><p>Thirteen days later, the second most senior American diplomat in Moscow answered a routine question from Washington with eight thousand words. It was never meant to be published.</p><p><strong>First pass:</strong> what does he say Soviet behaviour comes from?</p><p><strong>Second pass:</strong> hold it against Source A. They are describing the same relationship. What does each one blame?</p>",
    "source": {
      "attr": "Source B: from the telegram sent by George Kennan, the American charg&eacute; d'affaires in Moscow, to the Secretary of State, 22 February 1946, known as the Long Telegram. Department of State Records, reprinted in Foreign Relations of the United States 1946, Volume VI, Government Printing Office, 1969. A United States government work.",
      "body": "<div class=\"cable-head\"><span class=\"cab-secret\">Secret</span>861.00/2 2246 : Telegram<br><b>The Charg&eacute; in the Soviet Union (Kennan) to the Secretary of State</b><br>No. 511 &middot; Moscow, 22 February 1946, 9 p.m.<br>Received Washington, 22 February, 3:52 p.m.</div><p>(a) USSR still lives in antagonistic [hostile] 'capitalist encirclement' with which in the long run there can be no permanent peaceful coexistence &hellip;</p><p>It indicates that Soviet party line is not based on any objective analysis of situation beyond Russia's borders; that it has, indeed, little to do with conditions outside of Russia; that it arises mainly from basic inner-Russian necessities which existed before recent war and exist today.</p><p>At bottom of Kremlin's neurotic [anxious] view of world affairs is traditional and instinctive Russian sense of insecurity. Originally, this was insecurity of a peaceful agricultural people trying to live on vast exposed plain in neighborhood of fierce nomadic peoples &hellip;</p><p>First, it does not represent natural outlook of Russian people. Latter are, by and large, friendly to outside world &hellip;</p>",
      "toggle": "Start with the block at the top, because it is evidence too. Secret means this was written for about a dozen readers inside the American government. The two clock times are Moscow time and Washington time, which is why the telegram appears to arrive before it was sent. The clipped grammar with words missing is not carelessness: telegrams were charged by the word, so articles get dropped. Capitalist encirclement is Kennan quoting the Soviet view back, not stating his own. And the argument he is making is that Soviet hostility comes from inside Russia and its history, which means it will not be fixed by anything the West offers or concedes. That conclusion is what made the telegram famous, and it is the seed of the policy in Lesson 3.",
      "toggleLabel": "What does this actually mean?"
    },

    "html": "<h2>Thirteen days apart, on one screen</h2><p>You have read these one at a time. The exam will not let you do that.</p><p>Here is a piece of each, set against the other. Both men are explaining where the danger comes from.</p><div class=\"faceoff\"><div class=\"fo-panel fo-a\"><div class=\"fo-head\">Source A &middot; Stalin &middot; 9 February</div><p>As a matter of fact, the war broke out as the inevitable [unavoidable] result of the development of world economic and political forces on the basis of present-day monopolistic capitalism.</p></div><div class=\"fo-seam\">same relationship &middot; thirteen days</div><div class=\"fo-panel fo-b\"><div class=\"fo-head\">Source B &middot; Kennan &middot; 22 February</div><p>It indicates that Soviet party line is not based on any objective analysis of situation beyond Russia's borders &hellip; that it arises mainly from basic inner-Russian necessities which existed before recent war and exist today.</p></div></div><p>Find the cause each panel names before you turn the page.</p><p>Name both, in one sentence each, and you have a comparison. Name one and a marker has half an answer in front of them, however well you write it.</p>",

const CHIP = {
  Argue:{cls:"chip-argue"}, Evidence:{cls:"chip-evidence"}, Weigh:{cls:"chip-weigh"},
  Extract:{cls:"chip-extract"}, Interpret:{cls:"chip-interpret"}, Evaluate:{cls:"chip-evaluate"},
  instinct:{cls:"chip-instinct"}
};
// A lesson carries one spine or the other. Work it out on first use rather than at
// load time, so this never depends on FLOW having been evaluated yet.
const SOURCE_SPINE = ["Extract","Interpret","Evaluate"];
const ESSAY_SPINE  = ["Argue","Evidence","Weigh"];
let _spine = null;
function spine(){
  if(_spine) return _spine;
  const flow = (typeof FLOW !== "undefined" && Array.isArray(FLOW)) ? FLOW : [];
  _spine = flow.some(s => s && SOURCE_SPINE.includes(s.level)) ? SOURCE_SPINE : ESSAY_SPINE;
  return _spine;
}
// Never let an unknown label throw: an unrecognised spine word degrades to the neutral chip.
const chipCls = lvl => (CHIP[lvl] || CHIP.instinct).cls;

const stage = document.getElementById("stage");
const nav = document.getElementById("nav");
const topBar = document.getElementById("top-bar");
const nextBtn = document.getElementById("next-btn");
const backBtn = document.getElementById("back-btn");

const state = {
  idx: -1,                 // -1 = cover
  answers: {},             // qIdx -> chosen content index (mcq) or serialized (interactive)
  revealed: {},            // qIdx -> bool
  order: {},               // qIdx -> shuffled content-index array
  carRead: {},             // stepIdx -> Set of read card indices
  interState: {},          // qIdx -> working state for order/sort
};

const assessedIds = FLOW.map((f,i)=>(f.type==="question"&&f.level)?i:null).filter(i=>i!==null);

function esc(s){
  return String(s).replace(/[&<>"]/g, (c, i, str) => {
    if(c === "&"){
      // leave a real HTML entity intact (e.g. &middot; &amp; &#8635;)
      const rest = str.slice(i);
      if(/^&(#\d+|#x[0-9a-fA-F]+|[a-zA-Z]+);/.test(rest)) return "&";
    }
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}

// {optN} -> the letter option N carries after shuffle
function resolveOpts(text, order){
  if(!text) return text;
  return text.replace(/\{opt(\d+)\}/g,(m,n)=>{
    const p = order ? order.indexOf(parseInt(n,10)) : -1;
    return p>=0 ? String.fromCharCode(65+p) : m;
  });
}

// ============ CAROUSEL ============
function renderCarousel(item){

  read.add(pos);
  const c = cards[pos];

  const dots = cards.map((_,i)=>`<span class="car-dot ${read.has(i)?"read":""} ${i===pos?"here":""}"></span>`).join("");

  stage.innerHTML = `

// ============ STAT STRIP ============
function renderStat(item){
